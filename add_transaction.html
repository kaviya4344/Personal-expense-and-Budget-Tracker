{% extends "base.html" %}
{% block content %}
<h1>Add Transaction</h1>
<form method="POST">
<label>Transaction Type</label>
<select name="transaction_type" required>
<option value="Expense">Expense</option>
<option value="Income">Income</option>
</select>

<label>Category</label>
<select name="category" required>
<option>Food</option><option>Transport</option><option>Shopping</option>
<option>Bills</option><option>Education</option><option>Entertainment</option>
<option>Salary</option><option>Other</option>
</select>

<label>Amount</label>
<input type="number" name="amount" step="0.01" min="0" required>

<label>Description</label>
<input type="text" name="description" placeholder="Example: Grocery shopping">

<label>Date</label>
<input type="date" name="date" required>

<button type="submit">Add Transaction</button>
</form>
{% endblock %}
